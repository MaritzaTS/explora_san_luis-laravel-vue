<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explora San Luis, Antioquia — Ríos que conectan, montañas que inspiran." />
    <title>Explora San Luis</title>

    <!-- ================================================
         FUENTES — Playfair Display + DM Sans
         Playfair Display : títulos y headings
         DM Sans          : cuerpo de texto y UI
    ================================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- ================================================
         BOOTSTRAP 5.3.3 — CSS
         CDN con integridad SRI para producción segura
    ================================================ -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- ================================================
         BOOTSTRAP ICONS 1.11.3
    ================================================ -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- Favicon (reemplaza con tu ícono real) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
  </head>

  <body>
    <!-- Punto de montaje de la app Vue -->
    <div id="app"></div>

    <!-- ================================================
         BOOTSTRAP 5.3.3 — JS Bundle (incluye Popper)
         Cargado al final del body para mejor rendimiento
    ================================================ -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmg+9Ks8GXQrUrPcQYrn2bXiLbT"
      crossorigin="anonymous"
    ></script>

    <!-- ================================================
         VITE — Entry point
         Vite inyecta automáticamente el script del
         módulo principal al hacer el build.
    ================================================ -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
